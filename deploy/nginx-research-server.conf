server {
    listen 80;
    server_name amwresearchserver.com www.amwresearchserver.com;

    # Matches the app's own 512 MB multer limit — nginx's default is 1MB,
    # which would reject large uploads before they ever reach Node.
    client_max_body_size 512M;

    # Generous timeouts so a large upload over a slow connection doesn't
    # get cut off mid-transfer.
    client_body_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}