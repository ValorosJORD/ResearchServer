server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Matches the app's own 512 MB multer limit — nginx's default is 1MB,
    # which would reject large uploads before they ever reach Node.
    client_max_body_size 512M;

    # Generous timeouts: a large upload plus baksmali + CNN classification
    # (up to ~5 min on its own per the classifier's internal timeout) needs
    # real headroom above just the classifier's own budget.
    client_body_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}